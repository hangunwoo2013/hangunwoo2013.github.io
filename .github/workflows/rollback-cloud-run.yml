name: Roll back B-ROUTE Cloud Run revision

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target environment
        required: true
        type: choice
        options: [beta, production]
      revision:
        description: Existing Cloud Run revision name to receive 100% traffic
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    if: >-
      ${{
        vars.GCP_DEPLOY_ENABLED == 'true' &&
        ((inputs.target == 'beta' && vars.BETA_DEPLOY_APPROVED == 'true') ||
         (inputs.target == 'production' && vars.PROD_DEPLOY_APPROVED == 'true'))
      }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'beta' && 'beta' || 'production' }}
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'asia-northeast3' }}
      SERVICE: ${{ inputs.target == 'beta' && (vars.GCP_BETA_SERVICE || 'broute-beta') || (vars.GCP_PROD_SERVICE || 'broute-prod') }}
      REVISION: ${{ inputs.revision }}
      EXPECTED_BRANCH: ${{ inputs.target == 'beta' && 'beta' || 'main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Validate and roll back traffic
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]] || { echo "Run rollback from the matching ${EXPECTED_BRANCH} branch." >&2; exit 2; }
          [[ "$REVISION" =~ ^[a-z0-9-]+$ ]] || { echo "Invalid revision name" >&2; exit 2; }
          gcloud run services update-traffic "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --to-revisions "${REVISION}=100"
